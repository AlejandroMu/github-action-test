# ==========================================
# GitHub Action Test - Static HTML Deployment
# URL: /iaslab/github-action-test/
# ==========================================

location = /iaslab/github-action-test {
    return 301 /iaslab/github-action-test/$is_args$args;
}

location /iaslab/github-action-test/ {
    alias /home/iaslab/github-action-test/;
    index index.html;
    try_files $uri $uri/ /iaslab/github-action-test/index.html;
}
