name: Test Deployment with Self-Hosted Runner

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Build & Deploy on grid100
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Diagnostics & Environment Info
        run: |
          echo "=========================================="
          echo "  Ejecutando en: $(hostname)"
          echo "  Usuario actual: $(whoami)"
          echo "  Directorio de trabajo: $(pwd)"
          echo "  Fecha de ejecucion: $(date)"
          echo "=========================================="
          docker --version || echo "Docker no disponible"
          docker compose version || echo "Docker Compose no disponible"

      - name: Verify HTML Files
        run: |
          echo "Verificando presencia de index.html..."
          test -f index.html
          echo "index.html verificado correctamente ($(wc -c < index.html) bytes)."

      - name: Deploy Test Page to grid100
        run: |
          DEST_DIR="/home/iaslab/github-action-test"
          mkdir -p "$DEST_DIR"
          cp index.html "$DEST_DIR/index.html"
          echo "Pagina de prueba desplegada exitosamente en $DEST_DIR/index.html"
