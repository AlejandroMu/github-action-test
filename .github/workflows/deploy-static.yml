name: Deploy Static HTML (Main Branch)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-static:
    name: Static HTML Deployment on grid100
    runs-on: [ self-hosted ]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Diagnostics & Environment Info
        run: |
          echo "=========================================="
          echo "  Modo: Despliegue Estático (Rama Main)"
          echo "  Host: $(hostname)"
          echo "  Usuario: $(whoami)"
          echo "  Directorio: $(pwd)"
          echo "  Fecha: $(date)"
          echo "=========================================="

      - name: Verify Project Files
        run: |
          test -f index.html
          test -f nginx.conf
          echo "Archivos estáticos verificados."

      - name: Deploy Static Files to grid100
        run: |
          DEST_DIR="/home/iaslab/github-action-test"
          mkdir -p "$DEST_DIR"
          cp index.html "$DEST_DIR/index.html"
          cp nginx.conf "$DEST_DIR/nginx.conf"
          chmod -R 755 "$DEST_DIR"
          echo "Archivos desplegados exitosamente en $DEST_DIR"

      - name: Test & Reload Nginx
        run: |
          sudo nginx -t
          sudo systemctl reload nginx
          echo "Nginx recargado exitosamente para la ruta estatica."
