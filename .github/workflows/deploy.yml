name: Test Deployment with Self-Hosted Runner

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Build & Deploy on grid100
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Diagnostics & Environment Info
        run: |
          echo "=========================================="
          echo "  Ejecutando en: $(hostname)"
          echo "  Usuario actual: $(whoami)"
          echo "  Directorio de trabajo: $(pwd)"
          echo "  Fecha de ejecucion: $(date)"
          echo "=========================================="

      - name: Verify Project Files
        run: |
          test -f index.html
          test -f nginx.conf
          echo "Archivos verificados correctamente."

      - name: Deploy Files to grid100
        run: |
          DEST_DIR="/home/iaslab/github-action-test"
          mkdir -p "$DEST_DIR"
          cp index.html "$DEST_DIR/index.html"
          cp nginx.conf "$DEST_DIR/nginx.conf"
          chmod -R 755 "$DEST_DIR"
          echo "Archivos desplegados exitosamente en $DEST_DIR"

      - name: Test & Reload Nginx
        run: |
          echo "Validando configuracion de Nginx..."
          sudo nginx -t
          echo "Recargando Nginx..."
          sudo systemctl reload nginx
          echo "Nginx recargado exitosamente."
