name: Deploy Docker to Remote Server (grid101 via SSH)

on:
  push:
    branches:
      - remote-deploy
  workflow_dispatch:
    inputs:
      target_host:
        description: 'Servidor de destino para el despliegue'
        required: true
        default: 'grid101'
      deployment_mode:
        description: 'Modo de despliegue: script o inline'
        required: true
        default: 'script'
        type: choice
        options:
          - script
          - inline

jobs:
  # ============================================================================
  # OPCIÓN A: Despliegue mediante Script Modular (Recomendado)
  # ============================================================================
  deploy-with-script:
    name: Despliegue Remoto vía Script (grid100 -> grid101)
    runs-on: [ self-hosted ]
    if: "${{ github.event.inputs.deployment_mode == 'script' || github.event_name == 'push' }}"
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Diagnóstico y Validación de Entorno
        run: |
          echo "Ejecutando en Runner: $(hostname) como $(whoami)"
          ssh -o BatchMode=yes -o ConnectTimeout=5 iaslab@grid101 "echo 'Conexión exitosa a servidor de despliegue:' \$(hostname)"

      - name: Ejecutar Script de Despliegue Remoto
        run: |
          chmod +x ./scripts/remote-deploy.sh
          ./scripts/remote-deploy.sh grid101 iaslab /home/iaslab/github-action-remote 9088

  # ============================================================================
  # OPCIÓN B: Despliegue con Pasos Directos (Inline) en el Workflow
  # ============================================================================
  deploy-inline:
    name: Despliegue Remoto Paso a Paso (Inline en Workflow)
    runs-on: [ self-hosted ]
    if: "${{ github.event.inputs.deployment_mode == 'inline' }}"
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: 1. Compilar Imagen Docker en el Runner
        run: |
          echo "Compilando imagen en el runner..."
          docker build -t github-action-remote-app:latest .

      - name: 2. Transferir Imagen al Servidor Remoto (grid101)
        run: |
          echo "Transfiriendo imagen comprimida vía SSH..."
          docker save github-action-remote-app:latest | gzip -c | ssh iaslab@grid101 "gunzip -c | docker load"

      - name: 3. Sincronizar Archivos de Configuración
        run: |
          echo "Copiando docker-compose y nginx.conf..."
          ssh iaslab@grid101 "mkdir -p /home/iaslab/github-action-remote"
          scp docker-compose.yml nginx.conf iaslab@grid101:/home/iaslab/github-action-remote/
          ssh iaslab@grid101 "chmod -R 755 /home/iaslab/github-action-remote"

      - name: 4. Levantar Contenedor y Recargar Nginx en Destino
        run: |
          ssh iaslab@grid101 << 'REMOTE'
            set -euo pipefail
            cd /home/iaslab/github-action-remote
            docker compose down --remove-orphans || true
            docker compose up -d --force-recreate
            sudo nginx -t
            sudo systemctl reload nginx
          REMOTE

      - name: 5. Healthcheck Remoto
        run: |
          sleep 2
          ssh iaslab@grid101 "curl -sI http://127.0.0.1:9088/ | head -n 5"
