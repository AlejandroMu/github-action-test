services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: github-action-test-backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      DATA_DIR: /data
    volumes:
      - calc-data:/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: github-action-test-frontend
    restart: unless-stopped
    environment:
      PORT: "3000"
      BACKEND_URL: http://backend:3001
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: github-action-test:latest
    container_name: github-action-test-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:9088:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  calc-data:
